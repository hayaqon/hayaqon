name: Update GitHub Stats

on:
  schedule:
    - cron: "0 22 * * *" # Daily at 07:00 JST.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2 # Keep the parent when amending the latest stats commit.

      - name: Check stats token
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::Set the STATS_TOKEN repository secret to the PAT used for private repository statistics."
            exit 1
          fi

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=onedark
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&hide=css&theme=onedark
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Stats cards are unchanged."
            exit 0
          fi
          previous_head=$(git rev-parse HEAD)
          commit_message="chore(profile): update GitHub stats"
          if [ "$(git log -1 --format=%s)" = "$commit_message" ] &&
             [ "$(git log -1 --format=%ae)" = "$(git config user.email)" ]; then
            git commit --amend --no-edit
          else
            git commit -m "$commit_message"
          fi
          git push --force-with-lease="$GITHUB_REF:$previous_head" origin "HEAD:$GITHUB_REF"
